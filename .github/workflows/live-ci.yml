name: live-ci
on:
  push:
    branches: [main]
    paths: ["live/**", ".github/workflows/live-ci.yml"]
  pull_request:
    paths: ["live/**", ".github/workflows/live-ci.yml"]

defaults:
  run:
    working-directory: live

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: live/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: python -m pytest --cov=hvac_engine --cov-report=term-missing --cov-fail-under=90
      - name: demo is an acceptance test (22 checks)
        run: python -m hvac_engine.demo > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hvac-growth-engine:ci .
      - name: container boots and reports ready
        run: |
          docker run -d --name hge -p 8000:8000 hvac-growth-engine:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/readyz && exit 0; sleep 1; done
          docker logs hge; exit 1
