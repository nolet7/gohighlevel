[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-growth-engine"
version = "1.0.0"
description = "Lead follow-up, AI booking and calendar-fill automation: GoHighLevel + FieldPulse"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "tzdata>=2024.1",   # Windows has no system tz database; zoneinfo needs this
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
hge-demo = "hvac_engine.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E701", "E501"]          # compact one-line arrange/act style in tests
"scripts/*" = ["E402", "E501"]
"src/hvac_engine/sequences.py" = ["E501"]      # message templates read better unwrapped
"src/hvac_engine/demo.py" = ["E702", "E501"]
